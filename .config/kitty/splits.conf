# === 1. 分屏管理 (Windows Management) ===
# 使用 Option (alt) 一步到位，复刻 Tmux 逻辑
map alt+minus     launch --location=hsplit --cwd=last_reported
map alt+backslash launch --location=vsplit --cwd=last_reported

# 像 Vim 一样穿梭焦点
map alt+h neighboring_window left
map alt+l neighboring_window right
map alt+k neighboring_window up
map alt+j neighboring_window down

# 调整窗口大小 (调整级数设为 3，手感更干脆)
map alt+n resize_window narrower
map alt+w resize_window wider
map alt+u resize_window taller
map alt+d resize_window shorter 3

# 窗口高级操作
map alt+z kitten zoom_toggle.py
map alt+q focus_visible_window
map alt+x close_window

# === 2. 标签页管理 (Tabs Management) ===
# 新建标签页：直接在你当前目录下开启 (不再需要 ctrl+a>c)
map alt+c     launch --cwd=last_reported --type=tab

# 使用 Option + 数字键精准空降
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
map alt+0 goto_tab 10

# 使用 Option + 左右方向键轮播切换
map alt+left  previous_tab
map alt+right next_tab
map alt+,     set_tab_title

# === 3. 高级极客脚本 (Kittens) ===
# 唤起主题预览选择器
map alt+t kitten themes

# 抓取屏幕文字、URL、路径 (利用你配置的 custom-hints.py)
map alt+space kitten hints --alphabet asdfqwerzxcvjklmiuopghtybn1234567890 --customize-processing custom-hints.py

# 会话状态持久化 (修复了之前 session 拼写错误)
map alt+s launch --type=overlay --hold --allow-remote-control ~/.config/kitty/dump-session.sh
